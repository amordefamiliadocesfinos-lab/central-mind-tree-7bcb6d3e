name: Núcleo AC-01 — gateway restrito do piloto NUC
on:
  pull_request:
    paths:
      - "supabase/functions/nucleo-ac01-agent-proposal/**"
      - "supabase/functions/_shared/nucleo/ac01-agent-pilot-contract.ts"
      - "scripts/nucleo-ac01-agent-pilot.test.cjs"
      - "supabase/config.toml"
      - ".github/workflows/nucleo-ac01-agent-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Contract and mocked handler security cases
        run: node scripts/nucleo-ac01-agent-pilot.test.cjs
      - name: Front-end build regression
        run: npm run build
