name: CCH E5-D Governance Capture Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/cch/e5CaptureContracts.ts'
      - 'scripts/health-cch-e5d-capture.test.mjs'
      - '.github/workflows/health-cch-e5d-capture.yml'
permissions:
  contents: read
jobs:
  capture-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: |
          rm -rf .tmp-cch-e5d
          npx tsc src/modules/health/cch/e5CaptureContracts.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e5d --skipLibCheck
      - run: node --test scripts/health-cch-e5d-capture.test.mjs
      - run: npx eslint src/modules/health/cch/e5CaptureContracts.ts
      - run: npm run build
