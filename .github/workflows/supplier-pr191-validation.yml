name: supplier-pr191-validation
on:
  push:
    branches: [feat/supplier-center-v1-interface]
  workflow_dispatch:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
