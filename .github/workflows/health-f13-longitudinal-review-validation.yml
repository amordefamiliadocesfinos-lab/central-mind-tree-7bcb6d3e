name: Health F13 Longitudinal Review Validation

on:
  push:
    branches:
      - feat/health-f13-continuous-evolution-implementation-20261108
    paths:
      - 'supabase/migrations/*health_f13_*.sql'
      - 'supabase/tests/health_f13_*.sql'
      - 'src/modules/health/hooks/useHealthLongitudinalReviewF13.ts'
      - 'src/modules/health/pages/HealthLongitudinalReviewPage.tsx'
      - 'src/modules/health/pages/HealthDashboardPage.tsx'
      - 'src/modules/health/HealthModule.tsx'
      - 'src/modules/health/ui/HealthShell.tsx'
      - '.github/workflows/health-f13-longitudinal-review-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*health_f13_*.sql'
      - 'supabase/tests/health_f13_*.sql'
      - 'src/modules/health/hooks/useHealthLongitudinalReviewF13.ts'
      - 'src/modules/health/pages/HealthLongitudinalReviewPage.tsx'
      - 'src/modules/health/pages/HealthDashboardPage.tsx'
      - 'src/modules/health/HealthModule.tsx'
      - 'src/modules/health/ui/HealthShell.tsx'
      - '.github/workflows/health-f13-longitudinal-review-validation.yml'

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: health_f13_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_f13_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: health_f13_disposable
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Static F13 authority guard
        run: |
          set -euo pipefail
          rpc=supabase/migrations/20261108164609_health_f13_longitudinal_review_rpcs.sql
          if grep -Eiq '(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+public\.health_(goals|goal_phases|programs|program_versions|workout_sessions|workout_exercises|workout_sets|nutrition_[a-z_]+|body_[a-z_]+|sleep_[a-z_]+|recovery_[a-z_]+|integrated_[a-z_]+)' "$rpc"; then
            echo "F13 RPC attempts to mutate a specialist domain."
            exit 1
          fi
          test "$(grep -Fc "SET search_path = ''" "$rpc")" -eq 2
      - name: Install disposable Health foundation
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/health_f13_disposable_fixture.sql
      - name: Apply F13 migrations
        run: |
          set -euo pipefail
          for f in             supabase/migrations/20261108164607_health_f13_longitudinal_review_foundation.sql             supabase/migrations/20261108164609_health_f13_longitudinal_review_rpcs.sql             supabase/migrations/20261108164611_health_f13_longitudinal_review_security.sql             supabase/migrations/20261108164612_health_f13_longitudinal_review_integrity.sql
          do
            psql -X -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run F13 contract tests
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/health_f13_disposable_contract.sql

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard frontend writes
        run: |
          set -euo pipefail
          hook=src/modules/health/hooks/useHealthLongitudinalReviewF13.ts
          if grep -Eiq '\.(insert|update|delete)\(' "$hook"; then
            echo "F13 frontend must not use direct DML."
            exit 1
          fi
          grep -Fq 'health_f13_generate_longitudinal_review' "$hook"
          grep -Fq 'health_f13_record_review_outcome' "$hook"
      - name: F13 Health lint
        run: |
          npx eslint             src/modules/health/hooks/useHealthLongitudinalReviewF13.ts             src/modules/health/pages/HealthLongitudinalReviewPage.tsx             src/modules/health/pages/HealthDashboardPage.tsx             src/modules/health/HealthModule.tsx             src/modules/health/ui/HealthShell.tsx
      - name: Full build
        run: npm run build
