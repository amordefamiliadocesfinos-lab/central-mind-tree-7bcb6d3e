name: Financeiro D1 schema candidate disposable
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/architecture/proposals/FIN_D1_SCHEMA_CANDIDATE_NAO_APLICAR.sql'
      - 'supabase/tests/fin_d1_schema_compatibility_disposable.sql'
      - 'supabase/tests/fin_d1_writer_disposable.sql'
      - 'supabase/tests/fin_d1_rectification_writer_disposable.sql'
      - 'supabase/tests/fin_d1_account_projection_disposable.sql'
      - 'supabase/tests/fin_d1_cross_writer_concurrency_disposable.sh'
      - 'supabase/tests/fin_d1_consumer_export_disposable.sql'
      - 'src/lib/financial/d1SqlConsumerContract.disposable.ts'
      - 'src/lib/financial/d1ConsumerCompatibilityCandidate.ts'
      - 'docs/architecture/proposals/FIN_D1_ACCOUNT_PROJECTION_NAO_APLICAR.sql'
      - 'docs/architecture/proposals/FIN_D1_RECTIFICATION_WRITER_NAO_APLICAR.sql'
      - 'docs/architecture/proposals/FIN_D1_WRITER_CANDIDATE_NAO_APLICAR.sql'
      - '.github/workflows/financial-d1-schema-disposable.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: fin_d1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Candidate compatibility in disposable database
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_schema_compatibility_disposable.sql

      - name: Candidate writer and legacy trigger effects
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_writer_disposable.sql

      - name: Candidate rectification shadow projection
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_rectification_writer_disposable.sql

      - name: Candidate account and cash period projection
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_account_projection_disposable.sql

      - name: Cross-writer concurrency and readback
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: localtest
          PGDATABASE: fin_d1_disposable
        run: bash supabase/tests/fin_d1_cross_writer_concurrency_disposable.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL to TypeScript consumer contract
        env:
          PGPASSWORD: localtest
        run: |
          set -euo pipefail
          export_file=$(mktemp)
          trap 'rm -f "$export_file"' EXIT
          psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -At -f supabase/tests/fin_d1_consumer_export_disposable.sql > "$export_file"
          FIN_D1_EXPORT_FILE="$export_file" node --experimental-strip-types src/lib/financial/d1SqlConsumerContract.disposable.ts
