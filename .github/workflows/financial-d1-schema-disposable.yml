name: Financeiro D1 schema candidate disposable
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/architecture/proposals/FIN_D1_SCHEMA_CANDIDATE_NAO_APLICAR.sql'
      - 'supabase/tests/fin_d1_schema_compatibility_disposable.sql'
      - 'supabase/tests/fin_d1_writer_disposable.sql'
      - 'docs/architecture/proposals/FIN_D1_WRITER_CANDIDATE_NAO_APLICAR.sql'
      - '.github/workflows/financial-d1-schema-disposable.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: fin_d1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Candidate compatibility in disposable database
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_schema_compatibility_disposable.sql

      - name: Candidate writer and legacy trigger effects
        env:
          PGPASSWORD: localtest
        run: psql -X -h localhost -U postgres -d fin_d1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_d1_writer_disposable.sql
