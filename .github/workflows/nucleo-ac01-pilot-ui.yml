name: Núcleo AC-01 — ficha autenticada do piloto NUC
on:
  pull_request:
    paths:
      - "src/components/nucleo/NucleoAc01PilotRegistration.tsx"
      - "src/components/nucleo/NucleoDevelopmentCenter.tsx"
      - "scripts/nucleo-ac01-pilot-ui.test.cjs"
      - ".github/workflows/nucleo-ac01-pilot-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/nucleo-ac01-pilot-ui.test.cjs
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
