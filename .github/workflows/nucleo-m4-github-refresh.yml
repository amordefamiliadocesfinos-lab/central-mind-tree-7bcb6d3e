name: Nucleo M4 - GitHub read-only refresh preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nucleo-m4-github-refresh.yml"
      - "scripts/nucleo-m4-github-refresh.cjs"
      - "scripts/nucleo-m4-reconcile-review.cjs"
      - "scripts/nucleo-m4-discover-github.cjs"
      - "scripts/nucleo-m4-prioritize-review.cjs"
  schedule:
    - cron: "17 11 * * *"
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  evidence-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate refresh logic with synthetic GitHub responses
        run: node scripts/nucleo-m4-github-refresh.test.cjs
      - name: Validate unassigned discovery behavior
        run: node scripts/nucleo-m4-discover-github.test.cjs
      - name: Discover recent PRs and CI without front assignment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M4_DISCOVERY_OUTPUT: artifacts/nucleo-m4-discovery-unassigned.json
        run: node scripts/nucleo-m4-discover-github.cjs
      - name: Prioritize discovery without assigning a workstream or connecting to Core
        run: |
          printf '[]\n' > artifacts/core-metadata-empty.json
          node scripts/nucleo-m4-prioritize-review.cjs artifacts/nucleo-m4-discovery-unassigned.json artifacts/core-metadata-empty.json artifacts/nucleo-m4-prioritized-review.json
          rm artifacts/core-metadata-empty.json
      - name: Read official GitHub references and build review manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M4_MANIFEST_OUTPUT: artifacts/nucleo-m4-gh-refresh-manifest.json
        run: node scripts/nucleo-m4-github-refresh.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-m4-github-preflight
          path: |
            artifacts/nucleo-m4-gh-refresh-manifest.json
            artifacts/nucleo-m4-discovery-unassigned.json
            artifacts/nucleo-m4-prioritized-review.json
          retention-days: 7
