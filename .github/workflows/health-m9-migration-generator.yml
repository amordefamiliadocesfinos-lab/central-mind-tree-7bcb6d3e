name: M9 Migration Filename Generator

on:
  push:
    branches:
      - feat/health-m9-implementation-20261107
    paths:
      - '.github/workflows/health-m9-migration-generator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/health-m9-implementation-20261107
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Verify CLI and generate migration files
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration --help >/dev/null
          test -d supabase/migrations
          supabase migration new health_m9_sleep_recovery_foundation
          sleep 1
          supabase migration new health_m9_sleep_recovery_rpcs
          sleep 1
          supabase migration new health_m9_clinical_foundation
          sleep 1
          supabase migration new health_m9_clinical_rpcs
          sleep 1
          supabase migration new health_m9_security
          sleep 1
          supabase migration new health_m9_integrity

      - name: Commit generated migrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "No migration files generated"
            exit 1
          fi
          git commit -m "chore(health): generate M9 migration files with Supabase CLI"
          git push origin HEAD:feat/health-m9-implementation-20261107
