name: CCH E5-E Disposable Persistence Candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/candidates/health_cch_e5e_persistence_candidate.sql'
      - 'supabase/tests/health_cch_e5e_*'
      - '.github/workflows/health-cch-e5e-persistence.yml'
permissions:
  contents: read
jobs:
  e5-persistent-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e5-disposable-only
          POSTGRES_DB: e5_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d e5_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce isolated candidate and run sovereign-shape fixtures
        env:
          PGPASSWORD: e5-disposable-only
          E5_DISPOSABLE_ONLY: "YES"
        run: |
          set -euo pipefail
          test "$E5_DISPOSABLE_ONLY" = YES
          test ! -e supabase/migrations/20261119230000_health_cch_e5e_persistence.sql
          ID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$ID"
          run_sql() {
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d e5_disposable < "$1"
          }
          run_sql supabase/tests/health_cch_e2_disposable_fixture.sql
          run_sql supabase/tests/health_cch_e5e_persistence_fixture.sql
          run_sql supabase/candidates/health_cch_e5e_persistence_candidate.sql
          run_sql supabase/tests/health_cch_e5e_persistence_contract.sql

  e2-f22-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2-local-only
          POSTGRES_DB: e2_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d e2_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Re-run existing sovereign E2/F22/M3 synthetic publication baseline
        env:
          PGPASSWORD: e2-local-only
        run: |
          set -euo pipefail
          ID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$ID"
          run_sql() {
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < "$1"
          }
          run_sql supabase/tests/health_cch_e2_disposable_fixture.sql
          run_sql supabase/migrations/20261119094000_health_cch_e2b_draft_structure.sql
          run_sql supabase/migrations/20261119112000_health_cch_e2c_guarded_prescription.sql
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_f22_assert_program_version_structure\(/ {copy=1}
            copy {print}
            copy && /^TO authenticated;/ {exit}
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/f22.sql
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_m3_publish_program_version\(/ {copy=1}
            copy {print}
            copy && /^TO authenticated;/ {exit}
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/m3_publish.sql
          test "$(grep -c 'CREATE OR REPLACE FUNCTION' /tmp/f22.sql)" -eq 1
          test "$(grep -c 'CREATE OR REPLACE FUNCTION' /tmp/m3_publish.sql)" -eq 1
          run_sql /tmp/f22.sql
          run_sql /tmp/m3_publish.sql
          run_sql supabase/tests/health_cch_e2_lifecycle_fixture.sql
          run_sql supabase/tests/health_cch_e2_lifecycle_contract.sql
