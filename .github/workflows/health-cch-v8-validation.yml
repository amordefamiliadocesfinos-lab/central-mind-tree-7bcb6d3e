name: Health CCH V8 Equipment Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/**'
      - 'scripts/health-cch-v8.test.mjs'
      - 'supabase/migrations/*health_cch_equipment_v8*'
      - '.github/workflows/health-cch-v8-validation.yml'
permissions:
  contents: read
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          rm -rf .tmp-health-cch-v8
          npx tsc src/modules/health/cch/equipmentEvidence.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-health-cch-v8 --skipLibCheck
      - run: node --test scripts/health-cch-v8.test.mjs
      - run: npx eslint src/modules/health/cch/equipmentEvidence.ts src/modules/health/hooks/useHealthWorkoutM4.ts src/modules/health/pages/HealthWorkoutPage.tsx
      - run: npm run build
