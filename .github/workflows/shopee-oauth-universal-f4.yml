name: Shopee OAuth Universal F4 Integrated
on:
  pull_request:
    paths:
      - 'services/integration-hub/tests/shopee-oauth-f4-integrated.test.mjs'
      - 'services/integration-hub/src/shopee-oauth-*.mjs'
      - 'services/integration-hub/src/shopee-live-oauth.mjs'
      - 'supabase/functions/integration-core-bridge/**'
      - 'supabase/functions/shopee-oauth-connect-eligibility/**'
      - 'supabase/migrations/20261118*shopee*.sql'
      - '.github/workflows/shopee-oauth-universal-f4.yml'
  workflow_dispatch:
jobs:
  full-synthetic-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: F4 end-to-end simulated start callback and identity isolation
        run: node --test services/integration-hub/tests/shopee-oauth-f4-integrated.test.mjs
      - name: Complete OAuth regression chain
        run: |
          node --test services/integration-hub/tests/shopee-live-oauth.test.mjs
          node --test services/integration-hub/tests/shopee-universal-oauth-callback.test.mjs
          node --test services/integration-hub/src/shopee-oauth-universal-handoff.test.mjs
          node --test services/integration-hub/src/shopee-oauth-universal-start.test.mjs
          node --test services/integration-hub/tests/shopee-oauth-refresh-for-account.test.mjs
          node --test services/integration-hub/tests/shopee-oauth-refresh-once.test.mjs
      - name: Validate syntax
        run: |
          node --check services/integration-hub/src/shopee-live-oauth.mjs
          node --check services/integration-hub/src/app.mjs
          node --check services/integration-hub/src/core-bridge.mjs
          node --check supabase/functions/integration-core-bridge/handler.mjs
  edge-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: deno install
      - name: Validate authenticated eligibility and signed Core Bridge
        run: |
          deno check supabase/functions/shopee-oauth-connect-eligibility/index.ts
          deno check supabase/functions/integration-core-bridge/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate account eligibility policy
        run: node --test supabase/functions/_shared/shopee-oauth-authorization.test.mjs
  integrated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: shopee_f4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopee_f4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGDATABASE: shopee_f4
    steps:
      - uses: actions/checkout@v4
      - name: Apply entire F3-A..F3-D migration chain and assert CAS/approval
        run: |
          psql -v ON_ERROR_STOP=1 -f services/integration-hub/tests/fixtures/shopee-f3b-pg-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118150000_shopee_oauth_account_grants_f3a.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118153000_shopee_oauth_handoff_f3b.sql
          psql -v ON_ERROR_STOP=1 -f services/integration-hub/tests/fixtures/shopee-f3c-pg-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118160000_shopee_universal_oauth_state_binding_f3c.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118170000_shopee_oauth_multicontas_refresh_cas_f3d.sql
          psql -v ON_ERROR_STOP=1 -f services/integration-hub/tests/fixtures/shopee-f3d-pg-assert.sql
