      - "supabase/migrations/20261127155401_nucleo_u06f_ac01_sho_pilot.sql"
      - "scripts/nucleo-u06f-ac01-sho-pilot-disposable.test.sql"
      - "docs/architecture/proposals/NUCLEO_U06F_A07_AC01_TRANSVERSAL_CANDIDATE_NAO_APLICAR.sql"
      - "supabase/migrations/20261127191000_nucleo_u06f_a071_ac01_transversal.sql"
      - "scripts/nucleo-u06f-a07-ac01-transversal-disposable.test.sql"
      - "supabase/migrations/20261127192500_nucleo_u06f_a072_fm_writer.sql"
      - "scripts/nucleo-u06f-a072-fm-disposable.test.sql"
      - "docs/architecture/proposals/NUCLEO_U06F_A073_M3_CHECKPOINT_CANDIDATE_NAO_APLICAR.sql"
      - "scripts/nucleo-u06f-a073-m3-disposable.test.sql"
      - "supabase/migrations/20261127194500_nucleo_u06f_a073_m3_checkpoint.sql"
      - "supabase/migrations/20261127194501_nucleo_u06f_a074_m4_writer.sql"
      - "scripts/nucleo-u06f-a074-m4-disposable.test.sql"
      - ".github/workflows/nucleo-ac01-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-ac01:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable dependency schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-m1-db-test-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111193600_nucleo_m1_schema_capability.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111193601_nucleo_m1_harden_service_role.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111210000_nucleo_m2_source_references.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111222000_nucleo_m3_development_center.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261113210000_nucleo_v12_mandatos_auditaveis.sql
      - name: Apply AC-01 only to disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183000_nucleo_ac01_contributions.sql
      - name: Simulate permissive default privilege drift of the Cloud Core
        run: psql -X -v ON_ERROR_STOP=1 -c "GRANT ALL ON public.nucleo_specialist_contributions TO authenticated;"
      - name: Apply effective-grant hardening to disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183100_nucleo_ac01_revoke_inherited_write_grants.sql
      - name: Verify append-only grants, RLS and schema
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-schema.test.sql
      - name: Exercise authenticated pilot only on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-auth-pilot.test.sql
      - name: Install append-only review event schema in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183200_nucleo_ac01_review_events.sql
      - name: Exercise authenticated review/refinement and denied cases
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-review-events.test.sql
      - name: Install decision intake without decision powers (disposable only)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183300_nucleo_ac01_decision_requests.sql
      - name: Exercise decision-request authorization, no promotion, negative cases
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-decision-requests.test.sql
      - name: Install closed decision/publication gates on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183400_nucleo_ac01_decision_publication_gates.sql
      - name: Validate no implicit delegation, approval or publication
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-decision-publication-gates.test.sql
      - name: Exercise separate authorized decision and publication ONLY in disposable CI
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-decision-positive-disposable.test.sql
      - name: Install immutable grant revocations and hardened decision guards in disposable CI
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183500_nucleo_ac01_authority_revocation_gates.sql
      - name: Verify revocation, replacement, denied acts and sealed privileges in CI
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-revocation-succession.test.sql
      - name: Enforce one human authority per scope and role in disposable CI
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114183600_nucleo_ac01_exclusive_grants_guard.sql
      - name: Reject overlapping delegation and false grantor without opening rights
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac01-exclusive-delegations.test.sql
      - name: Apply AC02 proposed ledger only to disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f docs/architecture/proposals/NUCLEO_AC02_HANDOFF_APPENDONLY_PROPOSTA_NAO_APLICAR.sql
      - name: Exercise AC02 recipient and audit guards only in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac02-handoff-ledger-disposable.test.sql
      - name: Close AC02 direct JWT INSERT only in disposable CI
        run: psql -X -v ON_ERROR_STOP=1 -f docs/architecture/proposals/NUCLEO_AC02_FECHAMENTO_WRITE_DIRECT_PROPOSTA_NAO_APLICAR.sql
      - name: Verify no direct write path remains for JWT or service role
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-ac02-direct-write-gate-disposable.test.sql
      - name: Confirm official U06-F migration matches the validated candidate except its header
        run: |
          diff -u <(tail -n +2 docs/architecture/proposals/NUCLEO_U06F_AC01_SHO_PILOT_CANDIDATE_NAO_APLICAR.sql) <(tail -n +2 supabase/migrations/20261127155401_nucleo_u06f_ac01_sho_pilot.sql)
      - name: Apply official U06-F migration ONLY after historical regressions on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127155401_nucleo_u06f_ac01_sho_pilot.sql
      - name: Exercise U06-F narrow administrative import and human authorship
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-u06f-ac01-sho-pilot-disposable.test.sql
      - name: Verify A07.1 official migration equivalence
        run: diff -u <(tail -n +2 docs/architecture/proposals/NUCLEO_U06F_A07_AC01_TRANSVERSAL_CANDIDATE_NAO_APLICAR.sql) <(tail -n +2 supabase/migrations/20261127191000_nucleo_u06f_a071_ac01_transversal.sql)
      - name: Apply A07.1 official migration in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127191000_nucleo_u06f_a071_ac01_transversal.sql
      - name: Verify transverse proposal writer and legacy pilot
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-u06f-a07-ac01-transversal-disposable.test.sql
      - name: Install historical FM schema on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261112200000_nucleo_v12_ficha_viva_revisoes.sql
      - name: Apply A07.2 official FM migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127192500_nucleo_u06f_a072_fm_writer.sql
      - name: Verify FM CAS, replay, provenance and human writer
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-u06f-a072-fm-disposable.test.sql
      - name: Install M3 historical no-op guard on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111232500_nucleo_m3_ignore_noop_updates.sql
      - name: Verify A07.3 official migration equivalence
        run: diff -u <(tail -n +2 docs/architecture/proposals/NUCLEO_U06F_A073_M3_CHECKPOINT_CANDIDATE_NAO_APLICAR.sql) <(tail -n +2 supabase/migrations/20261127194500_nucleo_u06f_a073_m3_checkpoint.sql)
      - name: Apply A07.3 official migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127194500_nucleo_u06f_a073_m3_checkpoint.sql
      - name: Verify M3 CAS, audit and historical replay
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-u06f-a073-m3-disposable.test.sql
      - name: Install historical M4 contract on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111234500_nucleo_m4_technical_evidence.sql
      - name: Apply official A07.4 M4 migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261127194501_nucleo_u06f_a074_m4_writer.sql
      - name: Verify M4 observations, provenance, replay and M3 isolation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-u06f-a074-m4-disposable.test.sql
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/nucleo-ac01-readonly-desk.test.cjs
      - run: node scripts/nucleo-ux-a3a-ac01-journey.test.cjs
      - name: Verify UX-A5 truthful state presentation
        run: node scripts/nucleo-ux-a5-readable-states.test.cjs
      - run: node scripts/nucleo-ac01-document-governance.test.cjs
      - run: node scripts/nucleo-ac02-registry.test.cjs
      - run: node scripts/nucleo-ac02-authenticated-read.test.cjs
      - run: node scripts/nucleo-ac02-continuity-ui.test.cjs
      - run: node scripts/nucleo-ac02-handoff-evidence.test.cjs
      - run: node scripts/nucleo-ac02-continuity-summary.test.cjs
      - run: node scripts/nucleo-ac02-documentary-coverage.test.cjs
      - run: node scripts/nucleo-ac02-assumption-guide.test.cjs
      - run: node scripts/nucleo-ac02-knowledge-gaps.test.cjs
      - run: node scripts/nucleo-ac02-pacote-enxuto-sem-perdas.test.cjs
      - run: node scripts/nucleo-ac02-controlled-distribution.test.cjs
      - run: node scripts/nucleo-ac02-handoff-ledger-contract.test.cjs
      - run: node scripts/nucleo-ac02-package-manifest.test.cjs
      - run: node scripts/nucleo-ac02-write-preflight.test.cjs
      - name: Verify Núcleo V2.2 visual semantics in AC-01
        run: node scripts/nucleo-ux-v22-visual-identity.test.cjs
      - name: Verify UX V2.5 Core/local and documentary clarity
        run: node scripts/nucleo-ux-v25-core-local-clarity.test.cjs
      - name: LH02 LH03 human language and navigation labels
        run: node scripts/nucleo-ux-lh-human-language.test.cjs
      - name: SI01 documented journeys and authorized scope
        run: node scripts/nucleo-si01-documented-journeys.test.cjs
      - name: Verify Ficha Viva to AC01 contextual workflow
        run: node scripts/nucleo-fm-ac01-navigation.test.cjs
      - name: Verify AC01 to FM source-reconciliation contract
        run: node scripts/nucleo-ac01-fm-source-match.test.cjs
      - name: Verify AC01 version-to-decision lineage and FM candidates
        run: node scripts/nucleo-ac01-fm-lineage.test.cjs
      - name: Verify AC01 governed consolidation queue
        run: node scripts/nucleo-ac01-consolidation-queue.test.cjs
      - name: Verify AC01 assisted comparison without synthetic content diff
        run: node scripts/nucleo-ac01-assisted-comparison.test.cjs
      - name: Verify AC01 review criteria and fail-closed gates
        run: node scripts/nucleo-ac01-review-criteria.test.cjs
      - name: Verify AC01 human-review preparation remains read-only
        run: node scripts/nucleo-ac01-human-review-brief.test.cjs
      - name: Verify AC01 review continuity read-only scope
        run: node scripts/nucleo-ac01-review-continuity.test.cjs
      - name: Verify AC01 pending issue to existing review workflow
        run: node scripts/nucleo-ac01-pending-review-bridge.test.cjs
      - name: Verify AC01 post-review evidence is not proof of resolution
        run: node scripts/nucleo-ac01-postreview-evidence.test.cjs
      - name: Verify AC01 actual decision ID links and pending resolution
        run: node scripts/nucleo-ac01-verified-links.test.cjs
      - name: Verify per-contribution AC01 evidence and gaps
        run: node scripts/nucleo-ac01-evidence-panorama.test.cjs
      - name: Verify bidirectional AC01 contribution evidence navigation
        run: node scripts/nucleo-ac01-evidence-navigation.test.cjs
      - name: Verify AC01 contribution summary without authority promotion
        run: node scripts/nucleo-ac01-contribution-summary.test.cjs
      - run: npm run build
