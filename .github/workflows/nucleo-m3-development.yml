name: Nucleo M3 - Development center RLS
on:
  pull_request:
    paths:
      - "supabase/migrations/20261111222000_nucleo_m3_development_center.sql"
      - "scripts/nucleo-m3-workstreams-rls.test.sql"
      - ".github/workflows/nucleo-m3-development.yml"
      - "src/components/nucleo/NucleoDevelopmentCenter.tsx"
      - "scripts/nucleo-ux-din06-a11y.test.cjs"
      - "scripts/nucleo-ux-din05-execution.test.cjs"
      - "src/components/nucleo/NucleoPanoramaDinV30.tsx"
      - "src/components/nucleo/NucleoFocusPreviewV30.tsx"
      - "scripts/nucleo-ux-din04-preview.test.cjs"
      - "src/lib/nucleo/progressMetricsV30.ts"
      - "scripts/nucleo-ux-din03-metrics.test.cjs"
      - "scripts/nucleo-ux-din01-02.test.cjs"
      - "scripts/nucleo-ux-v26-resume.test.cjs"
      - "scripts/nucleo-ux-a1-v23-context-guard.test.cjs"
      - "src/components/nucleo/NucleoExecutiveDevelopment.tsx"
      - "src/styles/nucleoVisualV22.css"
      - "scripts/nucleo-ux-v22-visual-identity.test.cjs"
      - "src/components/nucleo/NucleoOperationalAtlas.tsx"
      - "scripts/nucleo-ux-v24-document-drafts.test.cjs"
      - "scripts/nucleo-ux-a3b-ficha-viva-context.test.cjs"
      - "scripts/nucleo-ux-a2-navigation.test.cjs"
      - "src/lib/nucleo/operationalKnowledgeV12.ts"
      - "src/lib/nucleo/operationalDraftsV12.ts"
      - "src/lib/nucleo/operationalProvenanceV12.ts"
      - "src/lib/nucleo/knowledgeArchiveSourcesV12.ts"
      - "src/components/nucleo/NucleoModuleKnowledge.tsx"
      - "scripts/nucleo-ux-a5-readable-states.test.cjs"
      - "src/lib/nucleo/documentDiffPresentationV13.ts"
      - "scripts/nucleo-ux-a4-comparacao-documental.test.cjs"
      - "src/components/nucleo/NucleoKnowledgeCoverage.tsx"
      - "src/components/nucleo/NucleoSupervisionPanel.tsx"
      - "src/components/nucleo/NucleoAuthorityCoverage.tsx"
      - "src/components/nucleo/NucleoMandateRegistry.tsx"
      - "src/components/nucleo/NucleoMandateProposal.tsx"
      - "supabase/migrations/20261113210000_nucleo_v12_mandatos_auditaveis.sql"
      - "supabase/migrations/20261112200000_nucleo_v12_ficha_viva_revisoes.sql"
      - "scripts/nucleo-v12-ficha-viva.test.sql"
      - "src/pages/Nucleo.tsx"
      - "scripts/nucleo-ux-v21-operational-flow.test.cjs"
      - "src/components/CapturaCentralFAB.tsx"
      - "src/components/GlobalFooterBar.tsx"
      - "src/index.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-m3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Restore synthetic M1 and M2 contracts
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-m1-db-test-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111193600_nucleo_m1_schema_capability.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111193601_nucleo_m1_harden_service_role.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111210000_nucleo_m2_source_references.sql
      - name: Apply M3 migration to disposable postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111222000_nucleo_m3_development_center.sql
      - name: Verify M3 access and history
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-m3-workstreams-rls.test.sql
      - name: Apply Ficha Viva migration in disposable Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261112200000_nucleo_v12_ficha_viva_revisoes.sql
      - name: Verify Ficha Viva RLS, append-only and revocation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/nucleo-v12-ficha-viva.test.sql
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify UX-A2 module-navigation contract
        run: node scripts/nucleo-ux-a2-navigation.test.cjs
      - name: Verify UX-A3B specialist/Ficha Viva navigation
        run: node scripts/nucleo-ux-a3b-ficha-viva-context.test.cjs
      - name: Verify UX-A4 conservative version-comparison presentation
        run: node scripts/nucleo-ux-a4-comparacao-documental.test.cjs
      - name: Verify UX-A5 responsive and accessible states
        run: node scripts/nucleo-ux-a5-readable-states.test.cjs
      - name: Verify Nucleo UX V2.1 operational navigation
        run: node scripts/nucleo-ux-v21-operational-flow.test.cjs
      - name: Verify Núcleo V2.2 visual identity and governance labels
        run: node scripts/nucleo-ux-v22-visual-identity.test.cjs
      - name: Verify UX-A1 navigation and unsaved edits
        run: node scripts/nucleo-ux-a1-v23-context-guard.test.cjs
      - name: Verify UX V2.4 document drafts
        run: node scripts/nucleo-ux-v24-document-drafts.test.cjs
      - name: Verify UX V2.6 home and resume
        run: node scripts/nucleo-ux-v26-resume.test.cjs
      - name: Verify UX-DIN-01/02 dynamic panorama and focused filters
        run: node scripts/nucleo-ux-din01-02.test.cjs
      - name: Verify UX-DIN-03 computed M3 coverage
        run: node scripts/nucleo-ux-din03-metrics.test.cjs
      - name: Verify UX-DIN-04 contextual preview
        run: node scripts/nucleo-ux-din04-preview.test.cjs
      - name: Verify UX-DIN-05 progressive execution
        run: node scripts/nucleo-ux-din05-execution.test.cjs
      - name: Verify UX-DIN-06 compact responsive navigation
        run: node scripts/nucleo-ux-din06-a11y.test.cjs
      - run: npm run build
