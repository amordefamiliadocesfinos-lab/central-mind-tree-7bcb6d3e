name: Financeiro E1 settlement disposable
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/tests/fin_e1_settlement_transaction_disposable.sql'
      - 'supabase/tests/fin_e1_settlement_concurrency_disposable.sh'
      - 'supabase/tests/fin_e1_rectification_disposable.sql'
      - '.github/workflows/financial-e1-settlement-disposable.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: fin_e1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated transaction and rollback
        env:
          PGPASSWORD: localtest
        run: psql -h localhost -U postgres -d fin_e1_disposable -v ON_ERROR_STOP=1 -f supabase/tests/fin_e1_settlement_transaction_disposable.sql

      - name: Verify concurrent settlements
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: localtest
          PGDATABASE: fin_e1_disposable
        run: bash supabase/tests/fin_e1_settlement_concurrency_disposable.sh

      - name: Verify immutable rectification
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: localtest
          PGDATABASE: fin_e1_disposable
        run: |
          set -euo pipefail
          awk '/^INSERT INTO obligation\(id,direction,original,reconciled\)/{found=1;exit} {print} END{if(!found)exit 1}' supabase/tests/fin_e1_settlement_transaction_disposable.sql > /tmp/fin-rectification-setup.sql
          echo 'COMMIT;' >> /tmp/fin-rectification-setup.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fin-rectification-setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/fin_e1_rectification_disposable.sql
