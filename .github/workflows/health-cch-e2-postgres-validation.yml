name: CCH E2 Isolated PostgreSQL Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*health_cch_e2b*'
      - 'supabase/migrations/*health_cch_e2c*'
      - 'supabase/tests/health_cch_e2*'
      - 'src/modules/health/cch/publicationStructure.ts'
      - 'scripts/health-cch-e2-f22.test.mjs'
      - 'supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql'
      - '.github/workflows/health-cch-e2-postgres-validation.yml'
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: e2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixture, real migration and contracts inside PostgreSQL container
        env:
          PGPASSWORD: postgres-ci-only
        run: |
          set -euo pipefail
          ID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$ID"
          for file in             supabase/tests/health_cch_e2_disposable_fixture.sql             supabase/migrations/20261119094000_health_cch_e2b_draft_structure.sql             supabase/migrations/20261119112000_health_cch_e2c_guarded_prescription.sql             supabase/tests/health_cch_e2_disposable_contract.sql             supabase/tests/health_cch_e2c_disposable_contract.sql
          do
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID"               psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < "$file"
          done
          # Execute the UNMODIFIED F22 assertion from its sovereign migration.
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_f22_assert_program_version_structure\(/ { copy=1 }
            copy { print }
            copy && /^TO authenticated;/ { exit }
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/health_e2_f22_original.sql
          grep -q "CREATE OR REPLACE FUNCTION" /tmp/health_e2_f22_original.sql
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < /tmp/health_e2_f22_original.sql
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < supabase/tests/health_cch_e2_f22_original_contract.sql
  visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Compile CCH E2 F22 mirror
        run: |
          rm -rf .tmp-health-cch-e2f22
          npx tsc src/modules/health/cch/publicationStructure.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-health-cch-e2f22 --skipLibCheck
      - run: node --test scripts/health-cch-e2-f22.test.mjs
      - run: npx eslint src/modules/health/cch/publicationStructure.ts src/modules/health/pages/HealthProgramPage.tsx
      - run: npm run build
