name: Health F13 TESTES MT Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-f13-testes-mt-validation.yml'
      - 'supabase/tests/health_f13_testes_mt_postcheck.sql'
      - 'supabase/tests/health_f13_testes_mt_smoke.sql'

permissions:
  contents: read

concurrency:
  group: health-f13-testes-mt
  cancel-in-progress: false

jobs:
  testes-mt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_REF: enfekhgcsbzovxtqdlwh

      URL_A: ${{ secrets.TESTES_MT_DATABASE_URL }}
      URL_B: ${{ secrets.TESTES_MT_DB_URL }}
      URL_C: ${{ secrets.SUPABASE_TESTES_MT_DATABASE_URL }}
      URL_D: ${{ secrets.SUPABASE_TESTES_MT_DB_URL }}
      URL_E: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}

      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.TESTES_MT_SUPABASE_ACCESS_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_TESTES_MT_ACCESS_TOKEN }}

      PW_A: ${{ secrets.TESTES_MT_DB_PASSWORD }}
      PW_B: ${{ secrets.SUPABASE_TESTES_MT_DB_PASSWORD }}
      PW_C: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify current Supabase CLI target syntax
        run: |
          set -euo pipefail
          supabase --version
          supabase db query --help | grep -q -- '--remote'

      - name: Resolve canonical TESTES MT credentials without exposing secrets
        shell: bash
        run: |
          set -euo pipefail

          selected_url=""
          for candidate in "$URL_A" "$URL_B" "$URL_C" "$URL_D" "$URL_E"; do
            if [ -n "$candidate" ]; then
              selected_url="$candidate"
              break
            fi
          done

          if [ -n "$selected_url" ]; then
            python3 -c 'import sys; from urllib.parse import urlparse; u=urlparse(sys.argv[1]); identity=f"{u.hostname or ""}|{u.username or ""}"; ref=sys.argv[2]; sys.exit(0 if ref in identity else "Refusing database URL: it does not identify the canonical TESTES MT project ref")' "$selected_url" "$TEST_REF"
            echo "TESTES_MT_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "::add-mask::$selected_url"
            echo "F13_REMOTE=$selected_url" >> "$GITHUB_ENV"
            echo "F13_REMOTE_MODE=url" >> "$GITHUB_ENV"
            echo "Resolved canonical TESTES MT target from a test-specific database URL."
            exit 0
          fi

          selected_token=""
          for candidate in "$TOKEN_A" "$TOKEN_B" "$TOKEN_C"; do
            if [ -n "$candidate" ]; then
              selected_token="$candidate"
              break
            fi
          done

          if [ -z "$selected_token" ]; then
            echo "TESTES_MT_AVAILABLE=false" >> "$GITHUB_ENV"
            {
              echo "### TESTES MT não executado"
              echo ""
              echo "Nenhum secret GitHub compatível com o TESTES MT canônico está disponível."
              echo "Nenhuma conexão ou alteração de banco foi realizada."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No compatible GitHub secret is available for canonical TESTES MT connectivity; remote validation is skipped."
            exit 0
          fi

          echo "TESTES_MT_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "::add-mask::$selected_token"
          echo "SUPABASE_ACCESS_TOKEN=$selected_token" >> "$GITHUB_ENV"
          echo "F13_REMOTE=$TEST_REF" >> "$GITHUB_ENV"
          echo "F13_REMOTE_MODE=project_ref" >> "$GITHUB_ENV"

          selected_pw=""
          for candidate in "$PW_A" "$PW_B" "$PW_C"; do
            if [ -n "$candidate" ]; then
              selected_pw="$candidate"
              break
            fi
          done

          if [ -n "$selected_pw" ]; then
            echo "::add-mask::$selected_pw"
            echo "SUPABASE_DB_PASSWORD=$selected_pw" >> "$GITHUB_ENV"
            echo "Using test-specific DB password with canonical TESTES MT ref."
          else
            echo "No test-specific DB password found; CLI will use its authenticated remote connection flow."
          fi

      - name: Preflight canonical TESTES MT baseline and dependency states
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query "
            SELECT CASE WHEN
              to_regclass('public.health_athletes') IS NOT NULL
              AND to_regclass('public.health_nutrition_rolling_states') IS NOT NULL
              AND to_regclass('public.health_body_rolling_states') IS NOT NULL
              AND to_regclass('public.health_sleep_recovery_rolling_states') IS NOT NULL
              AND to_regprocedure('public.health_can_read_athlete(uuid)') IS NOT NULL
              AND to_regprocedure('public.health_can_write_athlete(uuid)') IS NOT NULL
            THEN 'F13_TESTES_MT_BASELINE_OK'
            ELSE 'F13_TESTES_MT_BASELINE_BAD'
            END AS baseline,
            CASE
              WHEN to_regclass('public.health_integrated_decision_runs') IS NULL
                AND to_regclass('public.health_integrated_decisions') IS NULL
                AND to_regprocedure('public.health_f11_evaluate_integrated_decision(uuid,date,integer)') IS NULL
                THEN 'F11_ABSENT'
              WHEN to_regclass('public.health_integrated_decision_runs') IS NOT NULL
                AND to_regclass('public.health_integrated_decisions') IS NOT NULL
                AND to_regprocedure('public.health_f11_evaluate_integrated_decision(uuid,date,integer)') IS NOT NULL
                THEN 'F11_PRESENT'
              ELSE 'F11_PARTIAL'
            END AS f11_state,
            CASE
              WHEN to_regclass('public.health_longitudinal_review_runs') IS NULL
                AND to_regclass('public.health_longitudinal_review_outcomes') IS NULL
                AND to_regprocedure('public.health_f13_generate_longitudinal_review(uuid,date,integer)') IS NULL
                AND to_regprocedure('public.health_f13_record_review_outcome(uuid,text,text[],text)') IS NULL
                THEN 'F13_ABSENT'
              WHEN to_regclass('public.health_longitudinal_review_runs') IS NOT NULL
                AND to_regclass('public.health_longitudinal_review_outcomes') IS NOT NULL
                AND to_regprocedure('public.health_f13_generate_longitudinal_review(uuid,date,integer)') IS NOT NULL
                AND to_regprocedure('public.health_f13_record_review_outcome(uuid,text,text[],text)') IS NOT NULL
                THEN 'F13_PRESENT'
              ELSE 'F13_PARTIAL'
            END AS f13_state;
          " --read-only --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"

          grep -q 'F13_TESTES_MT_BASELINE_OK' <<<"$output"

          if grep -q 'F11_PARTIAL' <<<"$output"; then
            echo "Partial F11 schema detected. Refusing to continue."
            exit 1
          fi
          if grep -q 'F13_PARTIAL' <<<"$output"; then
            echo "Partial F13 schema detected. Refusing to continue."
            exit 1
          fi

          if grep -q 'F11_PRESENT' <<<"$output"; then
            echo "F11_PRESENT=true" >> "$GITHUB_ENV"
          else
            grep -q 'F11_ABSENT' <<<"$output"
            echo "F11_PRESENT=false" >> "$GITHUB_ENV"
          fi

          if grep -q 'F13_PRESENT' <<<"$output"; then
            echo "F13_PRESENT=true" >> "$GITHUB_ENV"
          else
            grep -q 'F13_ABSENT' <<<"$output"
            echo "F13_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - name: Apply exactly four F11 dependency migrations to TESTES MT when absent
        if: env.TESTES_MT_AVAILABLE == 'true' && env.F11_PRESENT == 'false'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          {
            echo 'BEGIN;'
            cat supabase/migrations/20261108144603_health_f11_integrated_decision_foundation.sql
            cat supabase/migrations/20261108144605_health_f11_integrated_decision_rpc.sql
            cat supabase/migrations/20261108144607_health_f11_integrated_decision_security.sql
            cat supabase/migrations/20261108144609_health_f11_integrated_decision_integrity.sql
            echo 'COMMIT;'
          } > "$tmp"
          supabase db query --file "$tmp" --yes --remote="$F13_REMOTE"
          rm -f "$tmp"

      - name: Validate F11 dependency structurally
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query --file supabase/tests/health_f11_testes_mt_postcheck.sql --read-only --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"
          grep -q 'F11_TESTES_MT_POSTCHECK_PASS' <<<"$output"

      - name: Validate F11 dependency functionally with rollback
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query --file supabase/tests/health_f11_testes_mt_smoke.sql --yes --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"
          grep -q 'F11_TESTES_MT_FUNCTIONAL_PASS' <<<"$output"

      - name: Apply exactly four F13 migrations to TESTES MT when absent
        if: env.TESTES_MT_AVAILABLE == 'true' && env.F13_PRESENT == 'false'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          {
            echo 'BEGIN;'
            cat supabase/migrations/20261108164607_health_f13_longitudinal_review_foundation.sql
            cat supabase/migrations/20261108164609_health_f13_longitudinal_review_rpcs.sql
            cat supabase/migrations/20261108164611_health_f13_longitudinal_review_security.sql
            cat supabase/migrations/20261108164612_health_f13_longitudinal_review_integrity.sql
            echo 'COMMIT;'
          } > "$tmp"
          supabase db query --file "$tmp" --yes --remote="$F13_REMOTE"
          rm -f "$tmp"

      - name: F13 structural and security postcheck
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query --file supabase/tests/health_f13_testes_mt_postcheck.sql --read-only --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"
          grep -q 'F13_TESTES_MT_POSTCHECK_PASS' <<<"$output"

      - name: F13 real functional smoke with full rollback
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query --file supabase/tests/health_f13_testes_mt_smoke.sql --yes --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"
          grep -q 'F13_TESTES_MT_FUNCTIONAL_PASS' <<<"$output"

      - name: Confirm no synthetic 2099 F13 data persisted
        if: env.TESTES_MT_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query "
            SELECT CASE WHEN
              NOT EXISTS (
                SELECT 1 FROM public.health_longitudinal_review_runs
                WHERE as_of_date=DATE '2099-12-31'
              )
              AND NOT EXISTS (
                SELECT 1 FROM public.health_longitudinal_review_outcomes o
                JOIN public.health_longitudinal_review_runs r ON r.id=o.review_run_id
                WHERE r.as_of_date=DATE '2099-12-31'
              )
            THEN 'F13_TESTES_MT_ROLLBACK_PASS'
            ELSE 'F13_TESTES_MT_ROLLBACK_FAIL'
            END AS result;
          " --read-only --remote="$F13_REMOTE" 2>&1)"
          printf '%s\n' "$output"
          grep -q 'F13_TESTES_MT_ROLLBACK_PASS' <<<"$output"

      - name: Record Git-only TESTES MT credential blocker
        if: env.TESTES_MT_AVAILABLE != 'true'
        run: |
          echo "F13_TESTES_MT_SKIPPED_NO_GITHUB_CREDENTIALS"
          echo "Required: a test-specific TESTES MT database URL secret, or a Supabase access token usable with ref $TEST_REF."
