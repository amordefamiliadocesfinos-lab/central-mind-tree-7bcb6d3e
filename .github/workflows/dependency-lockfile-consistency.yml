name: Dependency Lockfile Consistency
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-lockfile-consistency.yml'
  workflow_dispatch:
jobs:
  npm-ci-and-typescript:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reproducible npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript compilation
        run: npx tsc --noEmit -p tsconfig.app.json
