name: SAU SX03 Today and Navigation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/ui/HealthShell.tsx'
      - 'src/modules/health/ui/HealthJourneyF12.tsx'
      - 'src/modules/health/pages/HealthDashboardPage.tsx'
      - 'src/modules/health/HealthModule.tsx'
      - 'scripts/health-sau-sx03-*'
      - '.github/workflows/health-sau-sx03.yml'
permissions:
  contents: read
jobs:
  sx03:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Targeted lint
        run: npx eslint src/modules/health/ui/HealthShell.tsx src/modules/health/ui/HealthJourneyF12.tsx src/modules/health/pages/HealthDashboardPage.tsx
      - name: Production build
        run: npm run build
      - name: Synthetic interaction tests
        run: |
          npm install --no-save --no-package-lock --ignore-scripts vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0
          npx vitest run --config scripts/health-sau-sx03-vitest.config.ts
