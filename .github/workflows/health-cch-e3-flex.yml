name: CCH E3 Frozen Flexible Periodization Pure Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/cch/periodizationFlexibleE3.ts'
      - 'scripts/health-cch-e3-flex.test.mjs'
      - '.github/workflows/health-cch-e3-flex.yml'
permissions:
  contents: read
jobs:
  deterministic-e3:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: |
          rm -rf .tmp-cch-e3
          npx tsc src/modules/health/cch/periodizationFlexibleE3.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e3 --skipLibCheck
      - run: node --test scripts/health-cch-e3-flex.test.mjs
      - run: npx eslint src/modules/health/cch/periodizationFlexibleE3.ts
      - run: npm run build
