name: SAU SX09 Human Decisions UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/pages/HealthLongitudinalReviewPage.tsx'
      - 'src/modules/health/pages/HealthReplanningPage.tsx'
      - 'src/modules/health/pages/HealthRoutinePage.tsx'
      - 'scripts/health-sau-sx09-*'
      - '.github/workflows/health-sau-sx09.yml'
permissions:
  contents: read
jobs:
  sx09:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Targeted lint
        run: npx eslint src/modules/health/pages/HealthLongitudinalReviewPage.tsx src/modules/health/pages/HealthReplanningPage.tsx src/modules/health/pages/HealthRoutinePage.tsx
      - name: Production build
        run: npm run build
      - name: Synthetic interactions
        run: |
          npm install --no-save --no-package-lock --ignore-scripts vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0
          npx vitest run --config scripts/health-sau-sx09-vitest.config.ts
