name: Núcleo AC-02 — consulta restrita NUC
on:
  pull_request:
    paths:
      - "supabase/functions/nucleo-ac02-context-read/**"
      - "supabase/functions/_shared/nucleo/ac02-nuc-read-contract.ts"
      - "supabase/config.toml"
      - "src/components/nucleo/NucleoAc02NucContextRead.tsx"
      - "src/components/nucleo/NucleoDevelopmentCenter.tsx"
      - "scripts/nucleo-ac02-nuc-context.test.cjs"
      - ".github/workflows/nucleo-ac02-nuc-context.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/nucleo-ac02-nuc-context.test.cjs
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
