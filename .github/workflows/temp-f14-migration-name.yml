name: TEMP F14 Migration Name

on:
  push:
    branches:
      - feat/health-f14-assisted-replanning-implementation-20261108

permissions:
  contents: read

jobs:
  migration-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Create F14 migration filename
        run: |
          set -euo pipefail
          supabase migration new health_f14_assisted_replanning
          echo "F14_MIGRATION_FILE=$(find supabase/migrations -maxdepth 1 -type f -name '*health_f14_assisted_replanning.sql' -printf '%f\n' | tail -1)"
