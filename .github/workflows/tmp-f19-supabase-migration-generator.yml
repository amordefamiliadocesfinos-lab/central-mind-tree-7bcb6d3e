name: tmp-f19-supabase-migration-generator

on:
  push:
    paths:
      - .github/f19-migration-trigger.txt

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Discover CLI
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help
      - name: Generate migration filename only
        run: |
          supabase migration new health_f19_interactive_workout_timers
          find supabase/migrations -maxdepth 1 -type f -name '*health_f19_interactive_workout_timers.sql' -printf 'MIGRATION_FILE=%f\n'
