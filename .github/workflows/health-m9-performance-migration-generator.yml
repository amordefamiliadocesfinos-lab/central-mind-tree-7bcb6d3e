name: M9 Performance Migration Generator

on:
  push:
    branches:
      - feat/health-m9-implementation-20261107
    paths:
      - '.github/workflows/health-m9-performance-migration-generator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/health-m9-implementation-20261107
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Generate migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration --help >/dev/null
          supabase migration new health_m9_performance_indexes
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore(health): generate M9 performance migration"
          git push origin HEAD:feat/health-m9-implementation-20261107
