name: Health F11 Generate Migrations

on:
  push:
    branches:
      - feat/health-f11-integrated-motor-implementation-20261108
    paths:
      - '.github/workflows/health-f11-generate-migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/health-f11-generate-migrations.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/health-f11-integrated-motor-implementation-20261108
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Verify CLI migration command
        run: |
          supabase --version
          supabase migration new --help
      - name: Generate F11 migration files
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_health_f11_integrated_decision_foundation.sql" > /dev/null; then
            echo "F11 migrations already generated."
            exit 0
          fi
          supabase migration new health_f11_integrated_decision_foundation
          sleep 1
          supabase migration new health_f11_integrated_decision_rpc
          sleep 1
          supabase migration new health_f11_integrated_decision_security
          sleep 1
          supabase migration new health_f11_integrated_decision_integrity
      - name: Commit generated migrations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_health_f11_integrated_decision_*.sql
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(health): generate F11 migrations via Supabase CLI"
          git push origin HEAD:feat/health-f11-integrated-motor-implementation-20261108
