name: Health F13 Generate Migrations

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/health-f13-generate-migrations.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Verify Supabase CLI
        run: |
          supabase --version
          supabase migration new --help
      - name: Generate F13 migrations
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_health_f13_longitudinal_review_foundation.sql" > /dev/null; then
            echo "F13 migrations already exist."
            exit 0
          fi
          supabase migration new health_f13_longitudinal_review_foundation
          sleep 1
          supabase migration new health_f13_longitudinal_review_rpcs
          sleep 1
          supabase migration new health_f13_longitudinal_review_security
          sleep 1
          supabase migration new health_f13_longitudinal_review_integrity
      - name: Commit generated migrations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_health_f13_longitudinal_review_*.sql
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(health): generate F13 migrations via Supabase CLI"
          git push origin HEAD:feat/health-f13-continuous-evolution-implementation-20261108
