name: Financeiro E1 validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/financial/**'
      - 'src/hooks/useFinancial.ts'
      - 'src/hooks/useRealizedCash.ts'
      - 'src/lib/financial/**'
      - 'src/lib/invoiceSync.ts'
      - 'src/lib/invoiceSync.test.ts'
      - 'src/pages/Financeiro.tsx'
      - '.github/workflows/financial-e1-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/lib/financial/integrityDiagnostics.test.ts src/lib/financial/adjustedSettlementCandidate.test.ts src/lib/financial/realizedCash.test.ts src/lib/invoiceSync.test.ts src/lib/financial/d1ConsumerCompatibilityCandidate.test.ts src/lib/financial/categorySuggestion.test.ts src/lib/financial/globalSearch.test.ts
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
