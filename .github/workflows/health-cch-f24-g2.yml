name: CCH F24 G2 P2 P4 Comparable History UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/hooks/useF24WorkoutHistory.ts'
      - 'src/modules/health/cch/f24ComparableHistory.ts'
      - 'src/modules/health/pages/HealthWorkoutPage.tsx'
      - 'src/modules/health/components/HealthWorkoutInteractiveTimerF19.tsx'
      - 'scripts/health-cch-f24-g2-history.test.mjs'
      - 'scripts/health-cch-f24-f19-ssr-journey.test.mjs'
      - 'scripts/health-cch-f24-f19-interaction.test.tsx'
      - 'scripts/health-cch-f24-vitest.config.ts'
      - '.github/workflows/health-cch-f24-g2.yml'
permissions:
  contents: read
jobs:
  f24-g2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - name: Pure F24 comparability contracts
        run: |
          rm -rf .tmp-cch-f24-g2
          npx tsc src/modules/health/cch/f24ComparableHistory.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-f24-g2 --skipLibCheck
          node --test scripts/health-cch-f24-g2-history.test.mjs
      - name: F19 real React render journey (synthetic remount)
        run: node --test scripts/health-cch-f24-f19-ssr-journey.test.mjs
      - name: F19 click journey with synthetic React controller (no live data)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0
          npx vitest run --config scripts/health-cch-f24-vitest.config.ts
      - name: Frontend TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint
        run: npx eslint src/modules/health/hooks/useF24WorkoutHistory.ts src/modules/health/cch/f24ComparableHistory.ts src/modules/health/pages/HealthWorkoutPage.tsx src/modules/health/components/HealthWorkoutInteractiveTimerF19.tsx
      - name: Production build
        run: npm run build
