name: CRM F1-A Technical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/crm/**'
      - 'src/pages/ContatosInbox.tsx'
      - 'src/components/crm/ContactChatPanel.tsx'
      - '.github/workflows/crm-f1a-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
      - name: CRM F1-A regressions
        run: |
          npx --yes tsx src/lib/crm/operationalProjection.test.ts
          npx --yes tsx src/lib/crm/priority.test.ts
          npx --yes tsx src/lib/crm/canonical/transitions.test.ts
          npx --yes tsx src/lib/crm/aiContext.test.ts
