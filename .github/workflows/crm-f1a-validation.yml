name: CRM Technical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'src/lib/crm/**'
      - 'src/pages/ContatosInbox.tsx'
      - 'src/pages/TarefasAgendadas.tsx'
      - 'src/pages/Contatos.tsx'
      - 'src/App.tsx'
      - 'src/components/GlobalFooterBar.tsx'
      - 'src/components/GlobalSearchBar.tsx'
      - 'src/components/financial/ContactFormDialog.tsx'
      - 'src/components/crm/QuickConversationFAB.tsx'
      - 'src/components/crm/QuickConversationDialog.tsx'
      - 'src/hooks/useCrmCampaigns.ts'
      - 'src/components/crm/CampaignReviewDialog.tsx'
      - 'src/components/crm/CampaignsListDialog.tsx'
      - 'src/components/crm/CampaignPerformancePanel.tsx'
      - 'src/components/crm/InboxSaleDialog.tsx'
      - 'src/components/crm/AttendanceActionBar.tsx'
      - 'src/components/crm/CampaignCreateDialog.tsx'
      - 'src/components/crm/CampaignManualQueue.tsx'
      - 'supabase/functions/whatsapp-send/index.ts'
      - 'supabase/functions/crm-ai-assistant/index.ts'
      - 'supabase/functions/_shared/crm/reply-financial-guard.ts'
      - 'supabase/migrations/*crm_campaign_recipient_reconciliation.sql'
      - 'src/components/crm/PosVendaPanel.tsx'
      - 'src/components/crm/StartOpportunityPanel.tsx'
      - 'src/components/crm/ContactChatPanel.tsx'
      - 'src/components/crm/ContactProfileOverview.tsx'
      - 'src/components/financial/ContactsManager.tsx'
      - 'src/components/crm/ContactProfileMediaImport.tsx'
      - 'src/lib/crm/contactProfileWriter.ts'
      - 'src/lib/crm/contactEditContract.ts'
      - '.github/workflows/crm-f1a-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Confirm legacy quick-conversation entry points are absent
        run: |
          if git grep -niE 'QuickConversation(FAB|Dialog)|Registrar conversa|pc[.]quickconv[.]fab[.]position|⌘⇧W' -- src; then
            echo "::error::Legacy quick-conversation entry point remains under src/"
            exit 1
          fi
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
      - name: CRM regressions
        env:
          TZ: America/Sao_Paulo
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-only-not-a-real-key
        run: |
          status=0
          for file in \
            src/lib/crm/contactEditContract.test.ts \
            src/lib/crm/attendanceCommandSafety.test.ts \
            src/lib/crm/attendanceCommandPresentation.test.ts \
            src/lib/crm/crmGlobalNavigation.test.ts \
            src/lib/crm/crmRouteNavigationGuards.test.ts \
            src/lib/crm/crmFormExitProtection.test.ts \
            src/lib/crm/crmContactNavigation.test.ts \
            src/lib/crm/operationalProjection.test.ts \
            src/lib/crm/externalWhatsAppPreparation.test.ts \
            src/lib/crm/handoffEvidence.test.ts \
            src/lib/crm/campaignReplaySafety.test.ts \
            src/lib/crm/campaignDispatchEvidence.test.ts \
            src/lib/crm/campaignFormalReconciliation.test.ts \
            src/lib/crm/handoffOperationalAction.test.ts \
            src/lib/crm/handoffQueueEvidence.test.ts \
            src/lib/crm/postSalePanelOutreach.test.ts \
            src/lib/crm/postSalePanelLifecycle.test.ts \
            src/lib/crm/startOpportunityCandidates.test.ts \
            src/lib/crm/startOpportunityRecommendation.test.ts \
            src/lib/crm/startOpportunityNavigation.test.ts \
            src/lib/crm/startOpportunityPresentation.test.ts \
            src/lib/crm/campaignIntelligentAudience.test.ts \
            src/lib/crm/campaignIntelligentSafety.test.ts \
            src/lib/crm/inboxOrientation.test.ts \
            src/lib/crm/inboxVisualHierarchy.test.ts \
            src/lib/crm/priority.test.ts \
            src/lib/crm/pendingReply.test.ts \
            src/lib/crm/canonical/transitions.test.ts \
            src/lib/crm/canonical/operationalResponsibility.test.ts \
            src/lib/crm/officialTask.test.ts \
            src/lib/crm/aiContext.test.ts \
            src/lib/crm/crmPaymentSafety.test.ts \
            src/lib/crm/replyFinancialGuard.test.ts \
            src/lib/crm/aiResultSuggestion.test.ts \
            src/lib/crm/resultRegistrationPresentation.test.ts \
            src/lib/crm/campaignSales.test.ts \
            src/lib/crm/campaignPerformance.test.ts; do
            echo "::group::Test ${file}"
            npx --yes vite-node@3.2.4 "$file" || status=1
            echo "::endgroup::"
          done
          exit "$status"
