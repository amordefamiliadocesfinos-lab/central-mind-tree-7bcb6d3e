name: CRM Technical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/crm/**'
      - 'src/pages/ContatosInbox.tsx'
      - 'src/pages/Contatos.tsx'
      - 'src/hooks/useCrmCampaigns.ts'
      - 'src/components/crm/CampaignReviewDialog.tsx'
      - 'src/components/crm/CampaignManualQueue.tsx'
      - 'supabase/functions/whatsapp-send/index.ts'
      - 'supabase/migrations/*crm_campaign_recipient_reconciliation.sql'
      - 'src/components/crm/PosVendaPanel.tsx'
      - 'src/components/crm/ContactChatPanel.tsx'
      - '.github/workflows/crm-f1a-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # DIAGNÓSTICO TEMPORÁRIO: gerar delta do lock npm 10; remover antes da integração.
      - name: Diagnose missing npm lock entries
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const prior=JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8', maxBuffer: 100*1024*1024 }));
          const current=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const oldPaths=prior.packages || {};
          const newPaths=current.packages || {};
          const altered={};
          for (const path of Object.keys(newPaths)) {
            if(JSON.stringify(newPaths[path])!==JSON.stringify(oldPaths[path]))altered[path]=newPaths[path];
          }
          const removed=Object.keys(oldPaths).filter(path=>!Object.hasOwn(newPaths,path));
          const delta=JSON.stringify({lockfileVersion:current.lockfileVersion,altered,removed});
          console.log('LOCKDIAG_META '+JSON.stringify({old:Object.keys(oldPaths).length,new:Object.keys(newPaths).length,changed:Object.keys(altered).length,removed:removed.length,bytes:delta.length}));
          for(let i=0;i<delta.length;i+=3500)console.log('LOCKDIAG_PART '+String(i/3500).padStart(4,'0')+' '+delta.slice(i,i+3500));
          console.log('LOCKDIAG_END');
          NODE
      - name: End lock diagnostic early for review
        run: exit 1
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
      - name: CRM regressions
        env:
          TZ: America/Sao_Paulo
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-only-not-a-real-key
        run: |
          status=0
          for file in \
            src/lib/crm/operationalProjection.test.ts \
            src/lib/crm/externalWhatsAppPreparation.test.ts \
            src/lib/crm/handoffEvidence.test.ts \
            src/lib/crm/campaignReplaySafety.test.ts \
            src/lib/crm/campaignDispatchEvidence.test.ts \
            src/lib/crm/campaignFormalReconciliation.test.ts \
            src/lib/crm/handoffOperationalAction.test.ts \
            src/lib/crm/inboxOrientation.test.ts \
            src/lib/crm/priority.test.ts \
            src/lib/crm/canonical/transitions.test.ts \
            src/lib/crm/canonical/operationalResponsibility.test.ts \
            src/lib/crm/officialTask.test.ts \
            src/lib/crm/aiContext.test.ts; do
            echo "::group::Test ${file}"
            npx --yes vite-node@3.2.4 "$file" || status=1
            echo "::endgroup::"
          done
          exit "$status"
