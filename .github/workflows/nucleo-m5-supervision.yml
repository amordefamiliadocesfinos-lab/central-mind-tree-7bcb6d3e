name: Nucleo M5 - Read-only supervision
on:
  pull_request:
    paths:
      - "src/lib/nucleo/supervision.ts"
      - "src/components/nucleo/NucleoSupervisionPanel.tsx"
      - "src/components/nucleo/NucleoDevelopmentCenter.tsx"
      - "scripts/nucleo-m5-supervision.test.cjs"
      - "scripts/nucleo-m5-alertas-homologacao.test.cjs"
      - "scripts/nucleo-m5-demo-visual.test.cjs"
      - "src/lib/nucleo/supervision-demo.ts"
      - ".github/workflows/nucleo-m5-supervision.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test M5 deterministic supervisor
        run: node scripts/nucleo-m5-supervision.test.cjs
      - name: Homologate M5 alerts using synthetic scenarios
        run: node scripts/nucleo-m5-alertas-homologacao.test.cjs
      - name: Test M5 isolated visual demonstrations
        run: node scripts/nucleo-m5-demo-visual.test.cjs
      - name: Build full Panel Central
        run: npm run build
