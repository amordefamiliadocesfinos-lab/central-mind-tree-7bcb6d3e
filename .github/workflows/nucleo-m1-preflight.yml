name: Nucleo M1 — preflight offline
on:
  pull_request:
    paths:
      - scripts/nucleo-m1-preflight.cjs
      - scripts/nucleo-m1-preflight.test.cjs
      - .github/workflows/nucleo-m1-preflight.yml
      - docs/architecture/NUCLEO_M1_PORTOES_SEGURANCA_2026-11-11.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute 6 synthetic preflight tests
        run: node scripts/nucleo-m1-preflight.test.cjs
