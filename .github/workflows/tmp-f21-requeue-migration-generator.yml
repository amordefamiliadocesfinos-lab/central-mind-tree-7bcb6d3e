name: tmp-f21-requeue-migration-generator

on:
  push:
    branches: [main]
    paths:
      - .github/f21-requeue-trigger.txt

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Generate F21 requeue migration filename only
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new health_f21_void_workout_requeues_cch
          find supabase/migrations -maxdepth 1 -type f -name '*health_f21_void_workout_requeues_cch.sql' -printf 'MIGRATION_FILE=%f\n'
