name: CCH E3 Existing M3 M4 F21 Read-only Adapter
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/cch/e3ObservationAdapter.ts'
      - 'src/modules/health/hooks/useHealthE3ReadOnly.ts'
      - 'scripts/health-cch-e3-observation.test.mjs'
      - '.github/workflows/health-cch-e3-observation.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: |
          rm -rf .tmp-cch-e3b
          npx tsc src/modules/health/cch/e3ObservationAdapter.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e3b --skipLibCheck
      - run: node --test scripts/health-cch-e3-observation.test.mjs
      - run: npx eslint src/modules/health/cch/e3ObservationAdapter.ts src/modules/health/hooks/useHealthE3ReadOnly.ts
      - run: npm run build
