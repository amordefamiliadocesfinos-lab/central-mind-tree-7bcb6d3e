name: CCH E4 Frozen Technical Closure
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/cch/e3Pagination.ts'
      - 'src/modules/health/hooks/useHealthE3ReadOnly.ts'
      - 'scripts/health-cch-e3-pagination.test.mjs'
      - 'src/modules/health/cch/e2Preflight.ts'
      - 'src/modules/health/cch/publicationStructure.ts'
      - 'scripts/health-cch-e2-preflight.test.mjs'
      - 'scripts/health-cch-e2-f22.test.mjs'
      - '.github/workflows/health-cch-e4-closure.yml'
      - 'supabase/tests/health_cch_e2*'
      - 'supabase/migrations/*health_cch_e2b*'
      - 'supabase/migrations/*health_cch_e2c*'
      - 'supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql'
permissions:
  contents: read
jobs:
  pure-e4-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          rm -rf .tmp-cch-e3b .tmp-cch-e2-preflight .tmp-health-cch-e2f22
          npx tsc src/modules/health/cch/e3Pagination.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e3b --skipLibCheck
          npx tsc src/modules/health/cch/e2Preflight.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e2-preflight --skipLibCheck
          npx tsc src/modules/health/cch/publicationStructure.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-health-cch-e2f22 --skipLibCheck
      - run: node --test scripts/health-cch-e3-pagination.test.mjs scripts/health-cch-e2-preflight.test.mjs scripts/health-cch-e2-f22.test.mjs
      - run: npx eslint src/modules/health/cch/e3Pagination.ts src/modules/health/hooks/useHealthE3ReadOnly.ts src/modules/health/cch/e2Preflight.ts src/modules/health/cch/publicationStructure.ts
      - run: npm run build
  e4-draft-rls-f22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: e2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixture, real migration and contracts inside PostgreSQL container
        env:
          PGPASSWORD: postgres-ci-only
        run: |
          set -euo pipefail
          ID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$ID"
          for file in             supabase/tests/health_cch_e2_disposable_fixture.sql             supabase/migrations/20261119094000_health_cch_e2b_draft_structure.sql             supabase/migrations/20261119112000_health_cch_e2c_guarded_prescription.sql             supabase/tests/health_cch_e2_disposable_contract.sql             supabase/tests/health_cch_e2c_disposable_contract.sql
          do
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID"               psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < "$file"
          done
          # Execute the UNMODIFIED F22 assertion from its sovereign migration.
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_f22_assert_program_version_structure\(/ { copy=1 }
            copy { print }
            copy && /^TO authenticated;/ { exit }
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/health_e2_f22_original.sql
          grep -q "CREATE OR REPLACE FUNCTION" /tmp/health_e2_f22_original.sql
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < /tmp/health_e2_f22_original.sql
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < supabase/tests/health_cch_e2_f22_original_contract.sql
  e4-manual-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2-local-only
          POSTGRES_DB: e2_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d e2_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute real E2 and original F22/M3 functions in temporary database
        env:
          PGPASSWORD: e2-local-only
        run: |
          set -euo pipefail
          ID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)
          test -n "$ID"
          run_sql() {
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ID" \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d e2_disposable < "$1"
          }
          run_sql supabase/tests/health_cch_e2_disposable_fixture.sql
          run_sql supabase/migrations/20261119094000_health_cch_e2b_draft_structure.sql
          run_sql supabase/migrations/20261119112000_health_cch_e2c_guarded_prescription.sql
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_f22_assert_program_version_structure\(/ {copy=1}
            copy {print}
            copy && /^TO authenticated;/ {exit}
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/f22.sql
          awk '
            /^CREATE OR REPLACE FUNCTION public.health_m3_publish_program_version\(/ {copy=1}
            copy {print}
            copy && /^TO authenticated;/ {exit}
          ' supabase/migrations/20261112175528_health_f22_adaptive_training_maturity.sql > /tmp/m3_publish.sql
          test "$(grep -c 'CREATE OR REPLACE FUNCTION' /tmp/f22.sql)" -eq 1
          test "$(grep -c 'CREATE OR REPLACE FUNCTION' /tmp/m3_publish.sql)" -eq 1
          run_sql /tmp/f22.sql
          run_sql /tmp/m3_publish.sql
          run_sql supabase/tests/health_cch_e2_lifecycle_fixture.sql
          run_sql supabase/tests/health_cch_e2_lifecycle_contract.sql
