name: CCH E2 Read-only Preflight Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/health/cch/e2Preflight.ts'
      - 'src/modules/health/pages/HealthProgramPage.tsx'
      - 'scripts/health-cch-e2-preflight.test.mjs'
      - '.github/workflows/health-cch-e2-preflight.yml'
permissions:
  contents: read
jobs:
  e2-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: |
          rm -rf .tmp-cch-e2-preflight
          npx tsc src/modules/health/cch/e2Preflight.ts --target ES2022 --module ES2022 --moduleResolution bundler --rootDir src/modules/health/cch --outDir .tmp-cch-e2-preflight --skipLibCheck
      - run: node --test scripts/health-cch-e2-preflight.test.mjs
      - run: npx eslint src/modules/health/cch/e2Preflight.ts src/modules/health/pages/HealthProgramPage.tsx
      - run: npm run build
