name: Núcleo F1 — matriz isolada de menor privilégio
on:
  pull_request:
    paths:
      - "scripts/nucleo-f1-read-scope-model.cjs"
      - "scripts/nucleo-f1-read-scope-model.test.cjs"
      - "docs/architecture/NUCLEO_F1_MENOR_PRIVILEGIO_LEITURA_ESPECIALIDADE_2026-11-19.md"
      - ".github/workflows/nucleo-f1-leitura-especialidade.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/nucleo-f1-read-scope-model.test.cjs
