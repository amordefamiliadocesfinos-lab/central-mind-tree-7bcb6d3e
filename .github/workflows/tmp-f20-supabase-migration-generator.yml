name: tmp-f20-supabase-migration-generator

on:
  push:
    branches: [main]
    paths:
      - .github/f20-migration-trigger.txt

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Generate F20 migration filename only
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new health_f20_multimodal_daily_sessions
          find supabase/migrations -maxdepth 1 -type f -name '*health_f20_multimodal_daily_sessions.sql' -printf 'MIGRATION_FILE=%f\n'
