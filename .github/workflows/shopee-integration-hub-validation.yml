name: Shopee Integration Hub Tests and Docker
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/integration-hub/**'
      - 'supabase/functions/_shared/shopee-protocol.mjs'
      - 'supabase/functions/integration-core-bridge/**'
      - 'supabase/migrations/*shopee_minimum_cycle_state.sql'
      - 'supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql'
      - 'supabase/migrations/*shopee_logistics_read_state*.sql'
      - 'src/hooks/useShopeeLogisticsReadState.ts'
      - 'src/integrations/supabase/types.ts'
      - '.github/workflows/shopee-integration-hub-validation.yml'

permissions:
  contents: read

jobs:
  logistics-typescript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json

  hub-node22-and-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout the pull request commit (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node 22 full Integration Hub suite
        working-directory: services/integration-hub
        run: npm test
      - name: Build canonical runtime Dockerfile (no push)
        run: docker build --file services/integration-hub/Dockerfile --tag painel-shopee-hub-ci:${{ github.sha }} .
      - name: Run full tests inside built image, without network
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/integration-hub/tests,target=/workspace/services/integration-hub/tests,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/supabase/functions/integration-core-bridge,target=/workspace/supabase/functions/integration-core-bridge,readonly" \
            painel-shopee-hub-ci:${{ github.sha }} \
            sh -c 'node --test tests/*.test.mjs'
      - name: Runtime default-off protection in the built image
        run: |
          docker run --rm --network none painel-shopee-hub-ci:${{ github.sha }} \
            node --input-type=module -e "
              import { handleRequest } from './src/app.mjs';
              const outcome = await handleRequest(
                { method: 'POST', path: '/internal/shopee/live/logistics/shipping/ship-once', query: {}, headers: {} },
                { handleShopeeLive: async () => null, getEnv: () => undefined }
              );
              if (outcome.status !== 503 || JSON.parse(outcome.body).error !== 'ship_order_not_enabled') process.exit(1);
              console.log('ship-once OFF by default, HTTP 503');
              const cycle = await handleRequest(
                { method: 'POST', path: '/internal/shopee/live/cycle/run', query: {}, headers: {} },
                { handleShopeeLive: async () => null, getEnv: () => undefined }
              );
              if (cycle.status !== 503 || JSON.parse(cycle.body).error !== 'cycle_not_enabled') process.exit(1);
              console.log('recurring cycle OFF by default, HTTP 503');
            "

  core-and-cycle-postgres:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-local-fixture
          POSTGRES_DB: cycle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cycle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-local-fixture
      PGDATABASE: cycle_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Core entrypoint (no deploy)
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/integration-core-bridge/index.ts
      - name: Execute migrations and assertions in disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/cycle-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020225826_shopee_minimum_cycle_state.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/cycle-assertions.sql
      - name: Logistics RLS roles and deleted-order visibility in disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/logistics-read-fixture.sql
          # Reuse the canonical active-user helpers, not a permissive mock.
          head -n 36 supabase/migrations/20261003213000_production_operator_access.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261026210000_shopee_logistics_read_state.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261026211418_shopee_logistics_read_state_authorization.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/logistics-read-assertions.sql
      - name: Verify concurrent worker leases and document claims in independent sessions
        run: node services/integration-hub/tests/sql/check-concurrency.mjs
