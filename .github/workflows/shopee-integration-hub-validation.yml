name: Shopee Integration Hub Tests and Docker
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/integration-hub/**'
      - 'scripts/shopee-d11-local/**'
      - 'supabase/functions/_shared/shopee-protocol.mjs'
      - 'supabase/functions/integration-core-bridge/**'
      - 'supabase/migrations/*shopee_minimum_cycle_state.sql'
      - 'supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql'
      - 'supabase/migrations/*shopee_logistics_read_state*.sql'
      - 'src/hooks/useShopeeLogisticsReadState.ts'
      - 'src/integrations/supabase/types.ts'
      - '.github/workflows/shopee-integration-hub-validation.yml'

permissions:
  contents: read

jobs:
  logistics-typescript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json

  hub-node22-and-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout the pull request commit (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node 22 full Integration Hub suite
        working-directory: services/integration-hub
        run: npm test
      - name: Build canonical runtime Dockerfile (no push)
        run: docker build --file services/integration-hub/Dockerfile --tag painel-shopee-hub-ci:${{ github.sha }} .
      - name: Run full tests inside built image, without network
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/integration-hub/tests,target=/workspace/services/integration-hub/tests,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/supabase/functions/integration-core-bridge,target=/workspace/supabase/functions/integration-core-bridge,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/docs/operations/jornada-sku-v13,target=/workspace/docs/operations/jornada-sku-v13,readonly" \
            painel-shopee-hub-ci:${{ github.sha }} \
            sh -c 'node --test tests/*.test.mjs'
      - name: Runtime default-off protection in the built image
        run: |
          docker run --rm --network none painel-shopee-hub-ci:${{ github.sha }} \
            node --input-type=module -e "
              import { handleRequest } from './src/app.mjs';
              const outcome = await handleRequest(
                { method: 'POST', path: '/internal/shopee/live/logistics/shipping/ship-once', query: {}, headers: {} },
                { handleShopeeLive: async () => null, getEnv: () => undefined }
              );
              if (outcome.status !== 503 || JSON.parse(outcome.body).error !== 'ship_order_not_enabled') process.exit(1);
              console.log('ship-once OFF by default, HTTP 503');
              const cycle = await handleRequest(
                { method: 'POST', path: '/internal/shopee/live/cycle/run', query: {}, headers: {} },
                { handleShopeeLive: async () => null, getEnv: () => undefined }
              );
              if (cycle.status !== 503 || JSON.parse(cycle.body).error !== 'cycle_not_enabled') process.exit(1);
              console.log('recurring cycle OFF by default, HTTP 503');
            "

  core-and-cycle-postgres:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-local-fixture
          POSTGRES_DB: cycle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cycle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-local-fixture
      PGDATABASE: cycle_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Core entrypoint (no deploy)
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/integration-core-bridge/index.ts
      - name: Execute migrations and assertions in disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/cycle-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020225826_shopee_minimum_cycle_state.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/cycle-assertions.sql
      - name: D11 protected policy storage prototype (disposable, rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-policy-storage-prototype.sql
      - name: D11 policy-bound existing lease proof (disposable, rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-policy-lease-prototype.sql
      - name: D11 policy-bound durable claims proof (disposable, rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-policy-claim-prototype.sql
      - name: D11 fresh observation receipt proof (disposable, rolled back)
        run: psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-observation-prototype.sql
      - name: D11 existing commercial writer composition proof (disposable)
        shell: bash
        run: |
          set -Eeuo pipefail
          createdb p4_shopee_writer_disposable
          trap 'dropdb --if-exists p4_shopee_writer_disposable' EXIT
          export PGDATABASE=p4_shopee_writer_disposable
          sed '/^CREATE ROLE /d' supabase/tests/p4_shopee_writer_fixture_disposable.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-intake-composition-prototype.sql

      - name: D11 authenticated policy authoring and concurrent pause versus claim (disposable)
        run: |
          createdb d11_policy_test
          trap 'dropdb --if-exists d11_policy_test; psql -X -d cycle_test -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS d11_policy_author"' EXIT
          export PGDATABASE=d11_policy_test
          sed '/^CREATE ROLE /d' services/integration-hub/tests/sql/cycle-fixture.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020225826_shopee_minimum_cycle_state.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-policy-authoring-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/d11-policy-authoring-assertions.sql
          node services/integration-hub/tests/sql/check-d11-policy-concurrency.mjs
      - name: Logistics RLS roles and deleted-order visibility in disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/logistics-read-fixture.sql
          # Reuse the canonical active-user helpers, not a permissive mock.
          head -n 36 supabase/migrations/20261003213000_production_operator_access.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261026210000_shopee_logistics_read_state.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261026211418_shopee_logistics_read_state_authorization.sql
          psql -X -v ON_ERROR_STOP=1 -f services/integration-hub/tests/sql/logistics-read-assertions.sql
      - name: Verify concurrent worker leases and document claims in independent sessions
        run: node services/integration-hub/tests/sql/check-concurrency.mjs

  d11-local-auth:
    name: D11 local GoTrue/PostgREST consolidated migration proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local Supabase CLI and PostgreSQL client
        run: |
          npm install --prefix "$RUNNER_TEMP/d11-cli" --no-package-lock supabase@3.1.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Assemble and test a single local migration; never link hosted project
        shell: bash
        run: |
          set -Eeuo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL
          unset VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
          cli="$RUNNER_TEMP/d11-cli/node_modules/.bin/supabase"
          tmp="$(mktemp -d /tmp/d11-auth-XXXXXX)"
          id="shopee-d11-$GITHUB_RUN_ID"
          teardown(){
            (cd "$tmp" && timeout 180s "$cli" stop --no-backup --project-id "$id") >/dev/null 2>&1 || true
            rm -rf "$tmp"
            if docker ps -a --format '{{.Names}}' | grep -F "$id" || docker volume ls --format '{{.Name}}' | grep -F "$id"; then
              echo "D11 local teardown incomplete"; return 1
            fi
            echo "D11 local teardown verified"
          }
          trap teardown EXIT
          (cd "$tmp" && "$cli" init)
          sed -i "s/^project_id *=.*/project_id = \"$id\"/" "$tmp/supabase/config.toml"
          grep -Fx "project_id = \"$id\"" "$tmp/supabase/config.toml" >/dev/null
          (cd "$tmp" && "$cli" start --help >/dev/null && timeout 1100s "$cli" start) >"$tmp/start.log" 2>&1 || {
            echo "D11 local start failed; no remote fallback"; exit 1;
          }
          docker ps --format '{{.Names}}' | grep -Fx "supabase_db_$id" >/dev/null
          if docker ps --format '{{.Names}}' | grep -F "xkskyutmtlhivvpfxkjg"; then exit 1; fi
          (cd "$tmp" && "$cli" status -o env) >"$tmp/status.env"
          chmod 600 "$tmp/status.env"
          set -a
          source "$tmp/status.env"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          case "$DB_URL" in
            postgresql://postgres:*@127.0.0.1:54322/postgres) ;;
            *) echo "D11 non-local database rejected"; exit 1;;
          esac
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          root="$GITHUB_WORKSPACE/services/integration-hub/tests/sql"
          sed '/^CREATE ROLE /d' "$root/cycle-fixture.sql" | psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -f "$GITHUB_WORKSPACE/supabase/migrations/20261016220000_shopee_shipping_document_idempotency.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -f "$GITHUB_WORKSPACE/supabase/migrations/20261020225826_shopee_minimum_cycle_state.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -v d11_real_auth=1 -f "$root/d11-policy-authoring-fixture.sql"
          (cd "$tmp" && "$cli" migration new --help >/dev/null && "$cli" migration new d11_protected_cycle_policy)
          mapfile -t files < <(find "$tmp/supabase/migrations" -maxdepth 1 -name '*_d11_protected_cycle_policy.sql')
          test "${#files[@]}" -eq 1
          migration="${files[0]}"
          {
            echo '-- D11 generated candidate; not approved for hosted publication.'
            echo 'BEGIN;'
            for file in d11-policy-storage-schema.sql d11-policy-lease-schema.sql d11-policy-acquire-candidate.sql d11-preflight-lifecycle-candidate.sql d11-discovery-candidate.sql d11-observation-candidate.sql d11-policy-claim-candidate.sql d11-policy-authoring-candidate.sql; do
              printf '\n-- source: %s\n' "$file"
              cat "$root/$file"
            done
            echo 'COMMIT;'
          } > "$migration"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -f "$migration"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -c "NOTIFY pgrst, 'reload schema';"
          node scripts/shopee-d11-local/verify-auth.mjs
          mkdir -p "$GITHUB_WORKSPACE/test-results/d11"
          cp "$migration" "$GITHUB_WORKSPACE/test-results/d11/"
          sha256sum "$migration" | cut -d' ' -f1 > "$GITHUB_WORKSPACE/test-results/d11/sha256.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/test-results/d11/source-commit.txt"
      - name: Upload only generated SQL candidate and provenance
        uses: actions/upload-artifact@v4
        with:
          name: d11-local-migration-candidate
          path: test-results/d11/
          if-no-files-found: error
          retention-days: 7
