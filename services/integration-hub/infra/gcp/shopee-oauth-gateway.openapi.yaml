swagger: '2.0'
info:
  title: integration-hub-oauth
  description: Public OAuth ingress for the private Painel Central Integration Hub.
  version: '1.0'
schemes:
  - https
produces:
  - text/html
x-google-backend:
  address: https://integration-hub-899273223001.southamerica-east1.run.app
  jwt_audience: https://integration-hub-899273223001.southamerica-east1.run.app
  path_translation: APPEND_PATH_TO_ADDRESS
paths:
  /shopee/live/oauth/start:
    get:
      operationId: shopeeLiveOauthStart
      summary: Start the fixed Shopee Live pilot OAuth flow.
      responses:
        '302':
          description: Redirect to Shopee authorization.
        '400':
          description: Request rejected before authorization.
        '503':
          description: Integration Hub unavailable.
  /shopee/live/oauth/callback:
    get:
      operationId: shopeeLiveOauthCallback
      summary: Receive the Shopee Live OAuth callback.
      parameters:
        - name: code
          in: query
          type: string
          required: false
        - name: state
          in: query
          type: string
          required: false
        - name: shop_id
          in: query
          type: string
          required: false
        - name: main_account_id
          in: query
          type: string
          required: false
        - name: error
          in: query
          type: string
          required: false
        - name: message
          in: query
          type: string
          required: false
      responses:
        '200':
          description: OAuth callback processed.
        '400':
          description: Invalid OAuth callback.
        '409':
          description: OAuth state expired or already consumed.
        '502':
          description: Shopee upstream rejected or returned an incomplete response.
        '503':
          description: Integration Hub or Core persistence unavailable.
